        usuario_id:
          type: integer
        texto:
          type: string
        latitud:
          type: number
        longitud:
          type: number
        principal:
          type: boolean
        creado_en:
          type: string
          format: date-time
        actualizado_en:
          type: string
          format: date-time

    ListaDirecciones:
      type: object
