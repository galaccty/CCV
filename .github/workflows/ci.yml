# CI del backend del Centro Comercial Virtual
#
# Corre en cada push y en cada pull request. Ejecuta, en este orden:
#   1. Los guardianes estaticos de los invariantes 1, 4 y 7.
#   2. La verificacion de que existen los doce archivos de prueba.
#   3. Todas las pruebas automaticas.
#
# Las pruebas que necesitan base de datos SIEMPRE corren en CI: si la base no
# responde, fallan con un mensaje claro. No existe forma de saltarlas en CI
# (PERMITIR_SALTAR_BD se ignora cuando CI esta definido).

name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  verificar:
    name: Guardianes y pruebas
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ccv_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ccv_test?schema=public
      SESSION_SECRET: ci-secret-de-pruebas-0123456789abcdef
      SESSION_COOKIE_SECURE: "false"
      MAIL_DRIVER: ninguno

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Generar el cliente de Prisma
        run: npx prisma generate

      - name: Aplicar migraciones
        run: npx prisma migrate deploy

      - name: Guardianes estaticos de los invariantes 1, 4 y 7
        run: npm run check:invariantes

      - name: Verificar que existen las doce pruebas de invariantes
        run: npm run check:pruebas

      - name: Pruebas automaticas
        # Se llama al script de npm y no al comando directo a proposito:
        # la forma de invocar el runner de pruebas queda definida en un solo
        # lugar. Con `node --test tests/` (la forma de directorio) Node no
        # encuentra los archivos: hay que pasar el patron con glob.
        run: npm test