          type: integer
          nullable: true

    CambiarEstadoLocalRequest:
      type: object
      required: [estado]
      additionalProperties: false
      properties:
        estado:
          type: string
          enum: [activo, suspendido]

    EstadoSubPedido:
      type: string
      enum:
        - por_aceptar
        - preparando
        - enviado
        - entregado
        - en_disputa
        - cancelado
        - reembolsado
        - reembolsado_parcial

    Pedido:
      type: object
      required: [id, usuario_id, estado, metodo_pago, total, creado_en]
      properties:
        id:
          type: integer
        usuario_id:
          type: integer
        estado:
          type: string
          enum: [pendiente_pago, en_proceso, completado, cancelado, reembolsado, reembolso_pendiente, expirado]
        metodo_pago:
          type: string
          enum: [tarjeta, pse, nequi, efectivo, manual]
        total:
          type: integer
          description: Pesos. Suma de los totales de los sub-pedidos.
        direccion:
          type: object
          properties:
            texto:
              type: string
            latitud:
              type: number
            longitud:
              type: number
        config_snapshot:
          type: object
          description: Configuración congelada al crear el pedido (sección 4.2).
        creado_en:
          type: string
          format: date-time
        sub_pedidos:
          type: array
          items:
            $ref: '#/components/schemas/SubPedido'

    SubPedido:
      type: object
      required: [id, pedido_id, local_id, estado, total]
      properties:
        id:
          type: integer
        pedido_id:
          type: integer
        local_id:
          type: integer
        nombre_local:
          type: string
        subtotal_productos:
          type: integer
        costo_envio:
          type: integer
        comision:
          type: integer
        total:
          type: integer
        estado:
          $ref: '#/components/schemas/EstadoSubPedido'
        evidencia_envio:
          type: string
          nullable: true
        entrega_confirmada_por:
          type: string
          nullable: true
          enum: [comprador, vendedor, sistema]
        fecha_entrega:
          type: string
          format: date-time
          nullable: true
        saldo_liberado_en:
          type: string
          format: date-time
          nullable: true
          description: Nulo hasta que el job de retención libere el saldo (Etapa 4).
        detalles:
          type: array
          items:
            $ref: '#/components/schemas/DetalleProducto'

    DetalleProducto:
      type: object
      properties:
        id:
          type: integer
        variante_id:
          type: integer
        nombre_producto:
          type: string
        atributos_elegidos:
          type: object
          nullable: true
        cantidad:
          type: integer
        precio_unitario:
          type: integer

    ListaPedidos:
      type: object
      required: [datos, paginacion]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Pedido'
        paginacion:
          $ref: '#/components/schemas/Paginacion'

    ListaSubPedidos:
      type: object
      required: [datos, paginacion]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/SubPedido'
        paginacion:
          $ref: '#/components/schemas/Paginacion'

    Pago:
      type: object
      required: [id, referencia, monto, estado]
      properties:
        id:
          type: integer
        tipo_pago:
          type: string
          enum: [pedido, publicidad]
        pedido_id:
          type: integer
          nullable: true
        referencia:
          type: string
          description: Única. Generada por el backend con bytes aleatorios.
        id_transaccion_wompi:
          type: string
          nullable: true
        metodo_pago:
          type: string
          enum: [tarjeta, pse, nequi, efectivo, manual]
        monto:
          type: integer
        monto_reembolsado:
          type: integer
        estado:
          type: string
          enum: [pendiente, aprobado, rechazado, reembolsado, reembolsado_parcial]
        fecha_creacion:
          type: string
          format: date-time
        fecha_actualizacion:
          type: string
          format: date-time

    PagoCreado:
      type: object
      required: [pago, checkout]
      properties:
        pago:
          $ref: '#/components/schemas/Pago'
        checkout:
          type: object
          required: [llave_publica, referencia, monto_en_centavos, moneda, firma_integridad]
          properties:
            llave_publica:
              type: string
              description: Llave pública de Wompi (pub_test_ en sandbox).
            referencia:
              type: string
            monto_en_centavos:
              type: integer
            moneda:
              type: string
              enum: [COP]
            firma_integridad:
              type: string
              description: SHA256 de referencia + monto + moneda + secreto de integridad.
            url_checkout:
              type: string
              format: uri
              nullable: true
              description: URL del Web Checkout de Wompi.

    CuentaLocalResumen:
      type: object
      required: [local_id, nombre, estado, saldo_deuda, saldo_por_pagar, saldo_congelado, puede_vender]
      properties:
        local_id:
          type: integer
        usuario_id:
          type: integer
          description: Dueño del local. Se incluye en la vista del admin.
        nombre:
          type: string
        estado:
          $ref: '#/components/schemas/EstadoLocal'
        puede_vender:
          type: boolean
          description: Verdadero solo para `activo` y `en_plazo`.
        saldo_deuda:
          type: integer
          description: Deuda de comisión, en pesos.
        saldo_por_pagar:
          type: integer
          description: Saldo retenido disponible para liquidar, en pesos.
        saldo_congelado:
          type: integer
          description: Saldo retenido por reembolsos o disputas, en pesos.
        fecha_limite_pago:
          type: string
          format: date
          nullable: true
        actualizado_en:
          type: string
          format: date-time
          nullable: true

    MovimientoLedger:
      type: object
      required: [id, tipo, monto, fecha]
      properties:
        id:
          type: integer
        local_id:
          type: integer
          nullable: true
        sub_pedido_id:
          type: integer
          nullable: true
        pago_id:
          type: integer
          nullable: true
        reembolso_id:
          type: integer
          nullable: true
        pago_deuda_id:
          type: integer
          nullable: true
          description: Presente en los movimientos `cobro_deuda` y sus reversas.
        tipo:
          type: string
          enum:
            - venta
            - comision
            - reversa_comision
            - pago_recibido
            - cobro_deuda
            - pago_a_local
            - reembolso
            - ingreso_publicidad
            - ajuste
            - ajuste_redondeo
            - liberacion
            - congelacion
            - descongelacion
            - deuda_reembolso
            - reversa_pago_a_local
            - reversa_cobro_deuda
        monto:
          type: integer
          description: Monto firmado del movimiento, en pesos.
        fecha:
          type: string
          format: date-time

    ListaMovimientos:
      type: object
      required: [datos, paginacion]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/MovimientoLedger'
        paginacion:
          $ref: '#/components/schemas/Paginacion'

    MetodoPagoDeuda:
      type: string
      enum: [transferencia, efectivo, manual]

    EstadoPagoDeuda:
      type: string
      enum: [pendiente, confirmado, rechazado]

    PagoDeuda:
      type: object
      required:
        - id
        - local_id
        - monto
        - metodo
        - referencia
        - estado
        - fecha_reporte
      properties:
        id:
          type: integer
        local_id:
          type: integer
        monto:
          type: integer
        metodo:
          $ref: '#/components/schemas/MetodoPagoDeuda'
        referencia:
          type: string
        comprobante_url:
          type: string
          nullable: true
        estado:
          $ref: '#/components/schemas/EstadoPagoDeuda'
        reportado_por:
          type: integer
          nullable: true
        confirmado_por:
          type: integer
          nullable: true
        fecha_reporte:
          type: string
          format: date-time
        fecha_confirmacion:
          type: string
          format: date-time
          nullable: true
        motivo_rechazo:
          type: string
          nullable: true

    ListaPagosDeuda:
      type: object
      required: [datos, paginacion]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/PagoDeuda'
        paginacion:
          $ref: '#/components/schemas/Paginacion'

    ReportarPagoDeudaRequest:
      type: object
      required: [local_id, monto, metodo, referencia]
      additionalProperties: false
      properties:
        local_id:
          type: integer
        monto:
          type: integer
          minimum: 1
        metodo:
          $ref: '#/components/schemas/MetodoPagoDeuda'
        referencia:
          type: string
          minLength: 1
          maxLength: 255
          description: Referencia bancaria o número de recibo. Debe ser única.
        comprobante_url:
          type: string
          maxLength: 2000
          nullable: true

    RegistrarPagoDeudaRequest:
      type: object
      required: [monto, metodo, referencia]
      additionalProperties: false
      properties:
        monto:
          type: integer
          minimum: 1
        metodo:
          $ref: '#/components/schemas/MetodoPagoDeuda'
        referencia:
          type: string
          minLength: 1
          maxLength: 255
          description: Referencia bancaria o número de recibo. Debe ser única.
        comprobante_url:
          type: string
          maxLength: 2000
          nullable: true

    EventoWompi:
      type: object
      required: [event, data, signature, timestamp]
      properties:
        event:
          type: string
          example: transaction.updated
        data:
          type: object
          properties:
            transaction:
              type: object
              required: [id, reference, status, amount_in_cents]
              properties:
                id:
                  type: string
                reference:
                  type: string
                status:
                  type: string
                  enum: [PENDING, APPROVED, DECLINED, VOIDED, ERROR]
                amount_in_cents:
                  type: integer
                currency:
                  type: string
                customer_email:
                  type: string
                payment_method_type:
                  type: string
        environment:
          type: string
          enum: [test, prod]
        signature:
          type: object
          required: [properties, checksum]
          properties:
            properties:
              type: array
              items:
                type: string
              example: [transaction.id, transaction.status, transaction.amount_in_cents]
            checksum:
              type: string
        timestamp:
          type: integer
          description: UNIX timestamp usado en la firma.
        sent_at:
          type: string
          format: date-time
