        `bloqueado`: esos estados los maneja el sistema por deuda. Un local
        `en_plazo` o `bloqueado` puede suspenderse. La reactivación de un
        suspendido pasa por `recalcular_estado_local()` y termina en `activo`,
        `en_plazo` o `bloqueado` según su deuda real; no se puede forzar
        `activo` con un UPDATE directo. Cada cambio queda en `auditoria_admin`.
      operationId: cambiarEstadoLocal
      security:
        - cookieSesion: []
      parameters:
        - $ref: '#/components/parameters/IdLocal'
