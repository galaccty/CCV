          nullable: true
        nombre:
          type: string
          minLength: 1
          maxLength: 200
        descripcion:
          type: string
          nullable: true
        fotos:
          type: array
          items:
            type: string
          maxItems: 20
          nullable: true
        atributos:
          type: object
          additionalProperties: true
          nullable: true
        activo:
          type: boolean

    AjusteStockRequest:
      type: object
