        - nombre_local
        - producto_id
        - nombre_producto
        - atributos
        - foto_principal
        - precio_unitario
        - subtotal
        - disponible
      properties:
        id:
          type: integer
        variante_id:
          type: integer
        cantidad:
          type: integer
        local_id:
          type: integer
          description: Local que vende el producto.
        nombre_local:
          type: string
        producto_id:
          type: integer
        nombre_producto:
          type: string
        atributos:
          type: object
          additionalProperties: true
          nullable: true
          description: Atributos de la variante elegida.
        foto_principal:
          type: string
          nullable: true
          description: Primera foto del producto, o null si no tiene fotos.
        precio_unitario:
          type: integer
        subtotal:
          type: integer
        disponible:
          type: boolean

    Carrito:
      type: object
