openapi: 3.0.3
info:
  title: Centro Comercial Virtual - API
  version: 0.5.0
  description: |
    Contrato de la API del backend. Es la fuente de verdad: las rutas se
    implementan después de quedar documentadas aquí.

    Reglas generales:
    - Prefijo `/api/v1`.
    - Error único: `{ "error": { "codigo", "mensaje" } }`.
    - JSON en snake_case, fechas ISO 8601 UTC, dinero como entero en pesos.
    - Los POST que crean pedido o pago exigen `Idempotency-Key`.
    - Los POST con sesión exigen `X-CSRF-Token` (cookie doble).

    Etapa 3b: catálogo multi-local, rubros y categorías globales, variantes,
    carrito multi-local, cotización de envío, direcciones del comprador y
    pedido mínimo por local. El proveedor de pagos corre en modo `fake` hasta
    que existan las llaves de sandbox.

    Etapa 3c: autenticación y CSRF documentados, carrito con local y foto
    principal, y cuenta del comprador (perfil, cambio de contraseña y reenvío
    de la verificación del correo).

    CORS: el backend solo responde con credenciales al origen configurado en
    `CORS_ORIGINS`. Las coordenadas de las direcciones llegan desde el
    frontend; el backend valida el rango de Colombia y no geocodifica.

servers:
  - url: http://localhost:3000
    description: Desarrollo local

tags:
  - name: Autenticación
  - name: Cuenta
  - name: Catálogo
  - name: Carrito
  - name: Direcciones
  - name: Pedidos
  - name: Pagos
  - name: Sub-pedidos
  - name: Vendedor
  - name: Admin

security:
  - cookieSesion: []

paths:
  /api/v1/csrf:
    get:
      tags: [Autenticación]
      summary: Obtener el token anti-CSRF
      description: |
        Devuelve el token que el frontend debe enviar en la cabecera
        `X-CSRF-Token` en toda petición que modifica datos. Si el navegador
        todavía no tiene la cookie `ccv_csrf`, esta petición la crea.
      operationId: obtenerCsrf
      security: []
      responses:
        '200':
          description: Token anti-CSRF de la sesión del navegador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'

  /api/v1/auth/registro:
    post:
      tags: [Autenticación]
      summary: Crear una cuenta de comprador o vendedor
      description: |
        El correo queda sin verificar y se envía un enlace de verificación.
        No existe registro público de administradores. El rol `admin` no se
        acepta en esta ruta.
      operationId: registrarCuenta
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroRequest'
      responses:
        '201':
          description: Cuenta creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistroResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          description: Ya existe una cuenta con ese correo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/Error'

  /api/v1/auth/login:
    post:
      tags: [Autenticación]
      summary: Iniciar sesión
      description: |
        Deja la cookie httpOnly `ccv_sesion`. Solo permite entrar a cuentas
        activas con el correo verificado. La respuesta es idéntica exista o no
        la cuenta, para no revelar qué correos están registrados.
      operationId: iniciarSesion
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Sesión iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: Credenciales inválidas, cuenta desactivada o correo sin verificar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'

  /api/v1/auth/logout:
    post:
      tags: [Autenticación]
      summary: Cerrar sesión
      description: |
        Borra la cookie de sesión del navegador. No invalida el token firmado
        en el servidor, que deja de servir cuando expira.
      operationId: cerrarSesion
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Sesión cerrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeResponse'
        '403':
          $ref: '#/components/responses/Error'

  /api/v1/auth/yo:
    get:
      tags: [Autenticación]
      summary: Ver la cuenta conectada
      operationId: verCuentaConectada
      security:
        - cookieSesion: []
      responses:
        '200':
          description: Cuenta de la sesión actual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SesionResponse'
        '401':
          $ref: '#/components/responses/Error'

  /api/v1/auth/verificar-email:
    post:
      tags: [Autenticación]
      summary: Verificar el correo con el token del enlace
      description: El token sirve una sola vez y vence a las 24 horas.
      operationId: verificarEmail
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificarEmailRequest'
      responses:
        '200':
          description: Correo verificado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificacionEmailResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /api/v1/auth/solicitar-restablecimiento:
    post:
      tags: [Autenticación]
      summary: Pedir un enlace para restablecer la contraseña
      description: |
        Siempre responde lo mismo, exista o no la cuenta, para no revelar qué
        correos están registrados. El enlace vence a las 2 horas.
      operationId: solicitarRestablecimiento
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitarRestablecimientoRequest'
      responses:
        '200':
          description: Solicitud recibida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudRestablecimientoResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'

  /api/v1/auth/restablecer-contrasena:
    post:
      tags: [Autenticación]
      summary: Restablecer la contraseña con el token del enlace
      description: |
        El token sirve una sola vez y vence a las 2 horas. Al restablecer se
        cierran todas las sesiones abiertas del usuario.
      operationId: restablecerContrasena
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestablecerContrasenaRequest'
      responses:
        '200':
          description: Contraseña restablecida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestablecimientoResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'

  /api/v1/auth/perfil:
    patch:
      tags: [Cuenta]
      summary: Editar el nombre y el teléfono de la cuenta
      description: |
        Solo modifica los campos enviados. El correo no se puede cambiar por
        esta ruta. `telefono: null` borra el teléfono guardado.
      operationId: actualizarPerfil
      security:
        - cookieSesion: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarPerfilRequest'
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

  /api/v1/auth/cambiar-contrasena:
    post:
      tags: [Cuenta]
      summary: Cambiar la contraseña conociendo la actual
      description: |
        Exige la contraseña actual. Inutiliza los enlaces de restablecimiento
        pendientes. Cierra todas las demás sesiones del usuario: la sesión que
        hace el cambio recibe una cookie nueva y las anteriores dejan de ser
        válidas.
      operationId: cambiarContrasena
      security:
        - cookieSesion: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarContrasenaRequest'
      responses:
        '200':
          description: Contraseña cambiada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CambioContrasenaResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          description: Sin sesión o contraseña actual incorrecta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'

  /api/v1/auth/reenviar-verificacion:
    post:
      tags: [Cuenta]
      summary: Reenviar el correo de verificación
      description: |
        Responde lo mismo exista o no la cuenta y esté o no verificada, para
        no revelar correos. Solo envía un correo nuevo si la cuenta existe,
        está activa y todavía no está verificada. El enlace anterior deja de
        servir. Limitado a 3 solicitudes por hora por conexión.
      operationId: reenviarVerificacion
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReenviarVerificacionRequest'
      responses:
        '200':
          description: Solicitud recibida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SolicitudReenvioResponse'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '429':
          $ref: '#/components/responses/Error'

  /api/v1/pedidos:
    post:
      tags: [Pedidos]
      summary: Crear un pedido (checkout)
      description: |
        Valida stock (solo lo verifica, no lo descuenta), calcula todos los
        montos en el backend y congela la configuración en `config_snapshot`.
        Con un método digital el pedido nace en `pendiente_pago` y el stock se
        descuenta cuando el pago se confirme. Con `efectivo` nace en
        `en_proceso`, se crea un único pago pendiente con referencia
        `CCV-EF-*` y el stock se descuenta al aceptar el sub-pedido.
      operationId: crearPedido
      security:
        - cookieSesion: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutRequest'
      responses:
        '201':
          description: Pedido creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          description: La misma Idempotency-Key está en proceso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  codigo: solicitud_en_proceso
                  mensaje: Ya hay una solicitud con esa clave en proceso.
        '422':
          description: >
            Regla de negocio: stock insuficiente, pedido mínimo no alcanzado
            en alguno de los locales, local que no puede vender o variante
            inactiva.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [Pedidos]
      summary: Listar los pedidos del comprador
      operationId: listarPedidos
      security:
        - cookieSesion: []
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaPedidos'
        '401':
          $ref: '#/components/responses/Error'

  /api/v1/pedidos/{id}:
    get:
      tags: [Pedidos]
      summary: Ver un pedido del comprador
      operationId: verPedido
      security:
        - cookieSesion: []
      parameters:
        - $ref: '#/components/parameters/IdPedido'
      responses:
        '200':
          description: Pedido con sus sub-pedidos y detalles
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Pedido'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/pedidos/{id}/pagos:
    post:
      tags: [Pagos]
      summary: Crear el pago de un pedido
      description: |
        Genera una referencia aleatoria (nunca derivada del local ni de la
        hora), crea la fila en `pago` en estado `pendiente` y devuelve los
        datos firmados para abrir el checkout de Wompi. No se llama a la API
        de Wompi desde una transacción de base de datos.
      operationId: crearPago
      security:
        - cookieSesion: []
      parameters:
        - $ref: '#/components/parameters/IdPedido'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: Pago creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagoCreado'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: El pedido ya tiene pago o la clave está en proceso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: Pedido expirado o pago no disponible (p. ej. efectivo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/pagos/webhook:
    post:
      tags: [Pagos]
      summary: Evento de Wompi
      description: |
        Verifica la firma del evento, guarda el evento en `evento_webhook`,
        confirma el estado de la transacción contra la API de Wompi y recién
        entonces responde.

        - 200: procesado, ignorado o referencia desconocida (esta última alerta).
        - 401: firma inválida (el evento queda registrado).
        - 5xx: fallo transitorio; Wompi reintenta.
      operationId: webhookWompi
      security: []
      parameters:
        - name: X-Event-Checksum
          in: header
          required: false
          description: Checksum del evento. También se acepta `signature.checksum` en el cuerpo.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventoWompi'
      responses:
        '200':
          description: Evento procesado o registrado
          content:
            application/json:
              schema:
                type: object
                properties:
                  recibido:
                    type: boolean
                  resultado:
                    type: string
                    enum: [ok, ignorado, referencia_desconocida]
                  reembolso:
                    type: boolean
                    description: |
                      true cuando la confirmacion no pudo descontar stock y se
                      registro la transaccion B. Con el proveedor falso el
                      reembolso queda completado; con Wompi real queda
                      `pendiente` y el pedido pasa a `reembolso_pendiente` para
                      que el admin devuelva el dinero desde el panel de Wompi.
        '401':
          description: Firma inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Fallo transitorio; Wompi debe reintentar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/vendedor/sub-pedidos:
    get:
      tags: [Vendedor]
      summary: Listar los sub-pedidos de los locales del vendedor
      operationId: listarSubPedidosVendedor
      security:
        - cookieSesion: []
      parameters:
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EstadoSubPedido'
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaSubPedidos'
        '403':
          $ref: '#/components/responses/Error'

  /api/v1/vendedor/cuenta:
    get:
      tags: [Vendedor]
      summary: Ver la cuenta de un local del vendedor
      description: |
        Devuelve los saldos de `cuenta_local`, el estado del local y la fecha
        límite de pago. El vendedor solo puede consultar locales propios.
      operationId: obtenerCuentaVendedor
      security:
        - cookieSesion: []
      parameters:
        - $ref: '#/components/parameters/IdLocalQuery'
      responses:
        '200':
          description: Cuenta del local
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CuentaLocalResumen'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/vendedor/movimientos:
    get:
      tags: [Vendedor]
      summary: Listar los movimientos del ledger de un local propio
      operationId: listarMovimientosVendedor
      security:
        - cookieSesion: []
      parameters:
        - $ref: '#/components/parameters/IdLocalQuery'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Movimientos paginados, del más reciente al más antiguo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaMovimientos'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/vendedor/deuda/pagos:
    get:
      tags: [Vendedor]
      summary: Historial de pagos de deuda reportados por el vendedor
      description: |
        Lista los pagos de deuda de los locales del vendedor autenticado. El
        monto y el estado los decide el backend; el vendedor solo reporta.
      operationId: listarPagosDeudaVendedor
      security:
        - cookieSesion: []
      parameters:
        - name: local_id
          in: query
          required: false
          schema:
            type: integer
        - name: estado
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/EstadoPagoDeuda'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Pagos de deuda paginados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaPagosDeuda'
        '403':
          $ref: '#/components/responses/Error'
    post:
      tags: [Vendedor]
      summary: Reportar un pago de la deuda de comisión
      description: |
        El vendedor reporta un pago con su referencia y comprobante. El pago
        queda `pendiente` hasta que un admin lo confirme. Reportar no mueve el
        ledger ni reduce la deuda.

        El monto es el único dato monetario que envía el vendedor; no puede
        superar la deuda actual del local. La referencia es única.
      operationId: reportarPagoDeuda
      security:
        - cookieSesion: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportarPagoDeudaRequest'
      responses:
        '201':
          description: Pago reportado, pendiente de confirmación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagoDeuda'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: Referencia duplicada, deuda insuficiente o clave en proceso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Error'

  /api/v1/sub-pedidos/{id}/aceptar:
    post:
      tags: [Sub-pedidos]
      summary: Aceptar un sub-pedido (vendedor)
      description: |
        Transición `por_aceptar` -> `preparando`. En un pedido en efectivo,
        dentro de la misma transacción se descuenta el stock de cada línea. Si
        alguna no alcanza, el sub-pedido y el pedido se cancelan, el pago queda
        `rechazado` y no se genera deuda de comisión. En un pedido digital el
        stock ya se descontó al aprobarse el pago.
      operationId: aceptarSubPedido
      security:
        - cookieSesion: []
      parameters:
        - $ref: '#/components/parameters/IdSubPedido'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Sub-pedido actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubPedido'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/v1/sub-pedidos/{id}/enviar:
    post:
      tags: [Sub-pedidos]
      summary: Marcar un sub-pedido como enviado (vendedor)
      description: Transición `preparando` -> `enviado`. Exige evidencia de envío.
      operationId: enviarSubPedido
      security:
        - cookieSesion: []
      parameters:
        - $ref: '#/components/parameters/IdSubPedido'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [evidencia_envio]
              properties:
                evidencia_envio:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: >
                    Código de seguimiento, URL firmada o referencia del
                    domiciliario. El almacenamiento de archivos sigue pendiente
                    (sección 2 de la especificación).
      responses:
        '200':
          description: Sub-pedido actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubPedido'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/v1/sub-pedidos/{id}/entregar:
    post:
      tags: [Sub-pedidos]
      summary: Confirmar la entrega
      description: |
        Transición `enviado` -> `entregado`. La puede confirmar el comprador o
        el vendedor. En un pedido en efectivo, la misma transacción aprueba el
        pago, registra `venta` y `comision` con `local_id` (la comisión pasa a
        `saldo_deuda`) y recalcula el estado del local. En un pedido digital no
        se genera deuda nueva. Marcar entregado NO libera el saldo retenido de
        una venta digital: `saldo_liberado_en` sigue nulo hasta el job de
        retención (Etapa 4d).
      operationId: entregarSubPedido
      security:
        - cookieSesion: []
      parameters:
        - $ref: '#/components/parameters/IdSubPedido'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Sub-pedido actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubPedido'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

