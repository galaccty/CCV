        '404':
          $ref: '#/components/responses/Error'

  /api/v1/admin/locales/{id}/movimientos:
    get:
      tags: [Admin]
      summary: Listar los movimientos del ledger de un local
      operationId: listarMovimientosAdmin
      security:
        - cookieSesion: []
      parameters:
        - $ref: '#/components/parameters/IdLocal'
        - $ref: '#/components/parameters/Pagina'
        - $ref: '#/components/parameters/PorPagina'
      responses:
        '200':
          description: Movimientos paginados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListaMovimientos'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'

  /api/v1/admin/locales/{id}/pagos-deuda:
    post:
      tags: [Admin]
      summary: Registrar un pago de deuda ya recibido
      description: |
        Crea el pago directamente en estado `confirmado` y, en la misma
        transacción, registra `cobro_deuda` y recalcula el estado del local.
        El monto no puede superar la deuda actual.
      operationId: registrarPagoDeudaAdmin
      security:
        - cookieSesion: []
      parameters:
        - $ref: '#/components/parameters/IdLocal'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarPagoDeudaRequest'
      responses:
        '201':
          description: Pago registrado y aplicado a la deuda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagoDeuda'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: Deuda insuficiente, referencia duplicada o clave en proceso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Error'

  /api/v1/admin/pagos-deuda/{id}/confirmar:
    post:
      tags: [Admin]
      summary: Confirmar un pago de deuda reportado por el vendedor
      description: |
        Solo confirma un pago `pendiente`, una sola vez. En la misma
        transacción registra `cobro_deuda` con `pago_deuda_id`, reduce la deuda
        y recalcula el estado del local. Si el monto supera la deuda actual,
        responde 409 y no cambia nada.
      operationId: confirmarPagoDeudaAdmin
      security:
        - cookieSesion: []
      parameters:
        - $ref: '#/components/parameters/IdPagoDeuda'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '200':
          description: Pago confirmado y aplicado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagoDeuda'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          description: El pago ya no está pendiente, la deuda no alcanza o la clave está en proceso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          $ref: '#/components/responses/Error'

  /api/v1/admin/rubros:
    post:
      tags: [Admin]
      summary: Crear un rubro
      operationId: crearRubro
      security:
        - cookieSesion: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearRubroRequest'
      responses:
        '201':
          description: Rubro creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rubro'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/v1/admin/rubros/{id}:
    patch:
      tags: [Admin]
      summary: Renombrar un rubro
      operationId: actualizarRubro
      security:
        - cookieSesion: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarRubroRequest'
      responses:
        '200':
          description: Rubro actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rubro'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'

  /api/v1/admin/categorias-globales:
    post:
      tags: [Admin]
      summary: Crear una categoría global
      operationId: crearCategoriaGlobal
      security:
        - cookieSesion: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearCategoriaGlobalRequest'
      responses:
        '201':
          description: Categoría creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriaGlobal'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '422':
          $ref: '#/components/responses/Error'

  /api/v1/admin/categorias-globales/{id}:
    patch:
      tags: [Admin]
      summary: Actualizar una categoría global
      operationId: actualizarCategoriaGlobal
      security:
        - cookieSesion: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarCategoriaGlobalRequest'
      responses:
        '200':
          description: Categoría actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriaGlobal'
        '400':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '422':
          description: El padre no existe o se formaría un ciclo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    cookieSesion:
      type: apiKey
      in: cookie
      name: ccv_sesion

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Clave única por usuario y ruta. Vigencia 24 horas.
      schema:
        type: string
        minLength: 8
        maxLength: 255
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Mismo valor de la cookie `ccv_csrf`.
      schema:
        type: string
    Pagina:
      name: pagina
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PorPagina:
      name: por_pagina
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdPedido:
      name: id
      in: path
      required: true
      schema:
        type: integer
    IdSubPedido:
      name: id
      in: path
      required: true
      schema:
        type: integer
    IdLocal:
      name: id
      in: path
      required: true
      schema:
        type: integer
    IdLocalQuery:
      name: local_id
      in: query
      required: true
      description: Local del vendedor autenticado.
      schema:
        type: integer
    IdPagoDeuda:
      name: id
      in: path
      required: true
      schema:
        type: integer
    IdProducto:
      name: id
      in: path
      required: true
      schema:
        type: integer
    IdVariante:
      name: variante_id
      in: path
      required: true
      schema:
        type: integer
    IdVarianteVendedor:
      name: id
      in: path
      required: true
      schema:
        type: integer

  responses:
    Error:
      description: Error con el formato único
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [codigo, mensaje]
          properties:
            codigo:
              type: string
              example: validacion_invalida
            mensaje:
              type: string
            detalles:
              description: Solo para errores de validación.
              oneOf:
                - type: object
                - type: array
                  items:
                    type: object

    CsrfTokenResponse:
      type: object
      required: [token, cabecera]
      properties:
        token:
          type: string
          description: Mismo valor de la cookie `ccv_csrf`.
        cabecera:
          type: string
          example: X-CSRF-Token

    UsuarioCuenta:
      type: object
      required: [id, nombre, email, roles]
      properties:
        id:
          type: integer
        nombre:
          type: string
        email:
          type: string
          format: email
        email_verificado:
          type: boolean
        telefono:
          type: string
          nullable: true
          description: Solo dígitos, con `+` opcional al inicio.
        roles:
          type: array
          items:
            type: string
            enum: [comprador, vendedor, admin]

    MensajeResponse:
      type: object
      required: [mensaje]
      properties:
        mensaje:
          type: string

    Contrasena:
      type: string
      minLength: 10
      description: |
        Debe tener al menos 10 caracteres, una minúscula, una mayúscula y un
        número. Las contraseñas nunca se guardan en texto plano.

    RegistroRequest:
      type: object
      required: [nombre, email, contrasena, acepto_terminos]
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
        contrasena:
          $ref: '#/components/schemas/Contrasena'
        roles:
          type: array
          minItems: 1
          items:
            type: string
            enum: [comprador, vendedor]
        acepto_terminos:
          type: boolean
          enum: [true]

    RegistroResponse:
      type: object
      required: [mensaje, usuario]
      properties:
        mensaje:
          type: string
        usuario:
          $ref: '#/components/schemas/UsuarioCuenta'

    LoginRequest:
      type: object
      required: [email, contrasena]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
        contrasena:
          type: string
          minLength: 1

    LoginResponse:
      type: object
      required: [mensaje, usuario]
      properties:
        mensaje:
          type: string
        usuario:
          $ref: '#/components/schemas/UsuarioCuenta'

    SesionResponse:
      type: object
      required: [usuario]
      properties:
        usuario:
          $ref: '#/components/schemas/UsuarioCuenta'

    VerificarEmailRequest:
      type: object
      required: [token]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 10

    VerificacionEmailResponse:
      type: object
      required: [mensaje, email, verificado]
      properties:
        mensaje:
          type: string
        email:
          type: string
          format: email
        verificado:
          type: boolean

    SolicitarRestablecimientoRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email

    SolicitudRestablecimientoResponse:
      type: object
      required: [mensaje, enviado]
      properties:
        mensaje:
          type: string
        enviado:
          type: boolean

    RestablecerContrasenaRequest:
      type: object
      required: [token, contrasena]
      additionalProperties: false
      properties:
        token:
          type: string
          minLength: 10
        contrasena:
          $ref: '#/components/schemas/Contrasena'

    RestablecimientoResponse:
      type: object
      required: [mensaje, restablecida]
      properties:
        mensaje:
          type: string
        restablecida:
          type: boolean

    ActualizarPerfilRequest:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        nombre:
          type: string
          minLength: 2
          maxLength: 120
        telefono:
          type: string
          nullable: true
          pattern: '^\+?[0-9]{7,15}$'
          description: |
            Solo dígitos, con `+` opcional al inicio. Se guarda tal como llega,
            sin espacios ni guiones.

    PerfilResponse:
      type: object
      required: [mensaje, usuario]
      properties:
        mensaje:
          type: string
        usuario:
          $ref: '#/components/schemas/UsuarioCuenta'

    CambiarContrasenaRequest:
      type: object
      required: [contrasena_actual, contrasena_nueva]
      additionalProperties: false
      properties:
        contrasena_actual:
          type: string
          minLength: 1
        contrasena_nueva:
          $ref: '#/components/schemas/Contrasena'

    CambioContrasenaResponse:
      type: object
      required: [mensaje, actualizada]
      properties:
        mensaje:
          type: string
        actualizada:
          type: boolean

    ReenviarVerificacionRequest:
      type: object
      required: [email]
      additionalProperties: false
      properties:
        email:
          type: string
          format: email

    SolicitudReenvioResponse:
      type: object
      required: [mensaje, enviado]
      properties:
        mensaje:
          type: string
        enviado:
          type: boolean

    Paginacion:
      type: object
      required: [pagina, por_pagina, total, paginas]
      properties:
        pagina:
          type: integer
        por_pagina:
          type: integer
        total:
          type: integer
        paginas:
          type: integer

    DireccionEntrega:
      type: object
      required: [texto, latitud, longitud]
      properties:
        texto:
          type: string
          minLength: 5
          maxLength: 500
        latitud:
          type: number
          minimum: -5
          maximum: 14
          description: Rango aproximado de Colombia.
        longitud:
          type: number
          minimum: -83
          maximum: -66
          description: Rango aproximado de Colombia.

    CheckoutRequest:
      type: object
      required: [direccion, metodo_pago, items]
      additionalProperties: true
      properties:
        direccion:
          $ref: '#/components/schemas/DireccionEntrega'
        metodo_pago:
          type: string
          enum: [tarjeta, pse, nequi, efectivo]
          description: >
            Con `efectivo` se crea un pedido `en_proceso` y un pago pendiente
            con referencia `CCV-EF-*`; el stock se descuenta al aceptar, no al
            pagar. Con los métodos digitales el pedido nace `pendiente_pago` y
            el stock se descuenta cuando Wompi confirma el pago.
        items:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            required: [variante_id, cantidad]
            properties:
              variante_id:
                type: integer
              cantidad:
                type: integer
                minimum: 1
                maximum: 999
          description: >
            Los ítems pueden ser de varios locales. El backend los agrupa en
            sub-pedidos, calcula envío y comisión por local y aplica
            `pedido_minimo` al subtotal de productos de cada local. Cualquier
            monto enviado por el cliente se ignora: los precios salen de la
            base de datos.

    EstadoLocal:
      type: string
      enum: [pendiente_aprobacion, activo, en_plazo, bloqueado, suspendido]

    Rubro:
      type: object
      required: [id, nombre]
      properties:
        id:
          type: integer
        nombre:
          type: string

    ListaRubros:
      type: object
      required: [datos]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Rubro'

    CategoriaGlobal:
      type: object
      required: [id, nombre]
      properties:
        id:
          type: integer
        nombre:
          type: string
        padre_id:
          type: integer
          nullable: true
        rubro_id:
          type: integer
          nullable: true

    ListaCategoriasGlobales:
      type: object
      required: [datos]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/CategoriaGlobal'

    SubcategoriaLocal:
      type: object
      required: [id, local_id, nombre]
      properties:
        id:
          type: integer
        local_id:
          type: integer
        nombre:
          type: string

    Variante:
      type: object
      required: [id, producto_id, precio, stock, activo]
      properties:
        id:
          type: integer
        producto_id:
          type: integer
        atributos:
          type: object
          additionalProperties: true
          nullable: true
        precio:
          type: integer
          description: Pesos.
        stock:
          type: integer
        activo:
          type: boolean

    Producto:
      type: object
      required: [id, local_id, categoria_global_id, nombre, activo, variantes]
      properties:
        id:
          type: integer
        local_id:
          type: integer
        categoria_global_id:
          type: integer
        subcategoria_local_id:
          type: integer
          nullable: true
        nombre:
          type: string
        descripcion:
          type: string
          nullable: true
        fotos:
          type: array
          items:
            type: string
          nullable: true
        atributos:
          type: object
          additionalProperties: true
          nullable: true
        activo:
          type: boolean
        creado_en:
          type: string
          format: date-time
        variantes:
          type: array
          items:
            $ref: '#/components/schemas/Variante'

    VariantePublica:
      type: object
      required: [id, producto_id, precio, disponible]
      properties:
        id:
          type: integer
        producto_id:
          type: integer
        atributos:
          type: object
          additionalProperties: true
          nullable: true
        precio:
          type: integer
          description: Pesos.
        disponible:
          type: boolean
          description: Hay stock disponible.
        unidades_restantes:
          type: integer
          minimum: 0
          maximum: 5
          description: |
            Solo aparece cuando quedan cinco unidades o menos. Si hay más de
            cinco, la cantidad exacta no se expone.

    ProductoCatalogoPublico:
      type: object
      required: [id, local_id, categoria_global_id, nombre, activo, variantes]
      properties:
        id:
          type: integer
        local_id:
          type: integer
        categoria_global_id:
          type: integer
        subcategoria_local_id:
          type: integer
          nullable: true
        nombre:
          type: string
        descripcion:
          type: string
          nullable: true
        fotos:
          type: array
          items:
            type: string
          nullable: true
        atributos:
          type: object
          additionalProperties: true
          nullable: true
        activo:
          type: boolean
        creado_en:
          type: string
          format: date-time
        variantes:
          type: array
          items:
            $ref: '#/components/schemas/VariantePublica'

    LocalResumen:
      type: object
      required: [id, nombre]
      properties:
        id:
          type: integer
        nombre:
          type: string
        logo_url:
          type: string
          nullable: true
        banner_fondo_url:
          type: string
          nullable: true
        promedio_calificacion:
          type: number
        total_calificaciones:
          type: integer
        rubro:
          $ref: '#/components/schemas/Rubro'

    ProductoPublico:
      type: object
      required: [id, local_id, nombre, local, variantes]
      properties:
        id:
          type: integer
        local_id:
          type: integer
        categoria_global_id:
          type: integer
        subcategoria_local_id:
          type: integer
          nullable: true
        nombre:
          type: string
        descripcion:
          type: string
          nullable: true
        fotos:
          type: array
          items:
            type: string
          nullable: true
        atributos:
          type: object
          additionalProperties: true
          nullable: true
        creado_en:
          type: string
          format: date-time
        local:
          $ref: '#/components/schemas/LocalResumen'
        variantes:
          type: array
          items:
            $ref: '#/components/schemas/VariantePublica'

    Local:
      type: object
      required: [id, usuario_id, rubro_id, nombre, latitud, longitud, estado]
      properties:
        id:
          type: integer
        usuario_id:
          type: integer
        rubro_id:
          type: integer
        nombre:
          type: string
        logo_url:
          type: string
          nullable: true
        banner_fondo_url:
          type: string
          nullable: true
        latitud:
          type: number
        longitud:
          type: number
        estado:
          $ref: '#/components/schemas/EstadoLocal'
        promedio_calificacion:
          type: number
        total_calificaciones:
          type: integer
        creado_en:
          type: string
          format: date-time
        rubro:
          $ref: '#/components/schemas/Rubro'
        subcategorias:
          type: array
          items:
            $ref: '#/components/schemas/SubcategoriaLocal'
        productos:
          type: array
          items:
            $ref: '#/components/schemas/Producto'

    LocalPublico:
      type: object
      required: [id, usuario_id, rubro_id, nombre, latitud, longitud, estado]
      properties:
        id:
          type: integer
        usuario_id:
          type: integer
        rubro_id:
          type: integer
        nombre:
          type: string
        logo_url:
          type: string
          nullable: true
        banner_fondo_url:
          type: string
          nullable: true
        latitud:
          type: number
        longitud:
          type: number
        estado:
          $ref: '#/components/schemas/EstadoLocal'
        promedio_calificacion:
          type: number
        total_calificaciones:
          type: integer
        creado_en:
          type: string
          format: date-time
        rubro:
          $ref: '#/components/schemas/Rubro'
        subcategorias:
          type: array
          items:
            $ref: '#/components/schemas/SubcategoriaLocal'
        productos:
          type: array
          items:
            $ref: '#/components/schemas/ProductoCatalogoPublico'

    ListaLocales:
      type: object
      required: [datos, paginacion]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Local'
        paginacion:
          $ref: '#/components/schemas/Paginacion'

    ListaLocalesPublicos:
      type: object
      required: [datos, paginacion]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/LocalPublico'
        paginacion:
          $ref: '#/components/schemas/Paginacion'

    ListaProductos:
      type: object
      required: [datos, paginacion]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/Producto'
        paginacion:
          $ref: '#/components/schemas/Paginacion'

    ListaProductosPublicos:
      type: object
      required: [datos, paginacion]
      properties:
        datos:
          type: array
          items:
            $ref: '#/components/schemas/ProductoCatalogoPublico'
        paginacion:
          $ref: '#/components/schemas/Paginacion'

    CrearLocalRequest:
      type: object
