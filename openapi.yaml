        subtotal_productos:
          type: integer
        costo_envio:
          type: integer
        pedido_minimo:
          type: integer
        cumple_pedido_minimo:
          type: boolean
        faltante_pedido_minimo:
          type: integer
          description: Cero si ya cumple el mínimo.
        total:
          type: integer
          description: Subtotal de productos más envío; no incluye comisión.

    CotizacionCarrito:
      type: object
      required: [locales, total]
      properties:
        locales:
          type: array
          items:
            $ref: '#/components/schemas/CotizacionLocal'
        total:
          type: integer

    Direccion:
      type: object
      required:
        - id
        - usuario_id
        - texto
        - latitud
        - longitud
        - principal
        - creado_en
