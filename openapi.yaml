      additionalProperties: false
      properties:
        texto:
          type: string
          minLength: 5
          maxLength: 500
        latitud:
          type: number
          minimum: -5
          maximum: 14
        longitud:
          type: number
          minimum: -83
          maximum: -66

    CrearRubroRequest:
